<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Amy Brumet</title>
<link rel="icon" type="image/svg+xml" href="img/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* VOICE: Amy's existing site, quiet and precise; case studies read like the homepage continued
   IDEA: a designer's desk of project prints you can push around, each one opens into its story
   PICTURE: the draggable vignette collage on a dotted grid, same as hiamyb.com
   COLOUR and TYPE: warm paper #FCFAF7, warm greys, Inter body, DM Mono labels and dates
   LAYOUT: 608px reading column, collage band full width, case study = same column with a wide hero */
:root{color-scheme:light;--bg:#FCFAF7;--ink:#52504E;--ink2:#6B6663;--mute:#A39E99;--line:#E8E4DF;--icon:#C4C2C0;--dot:#DEDAD5;--strong:#2E2C2A}
*{box-sizing:border-box;min-width:0}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink2);font:16px/24px Inter,system-ui,sans-serif;letter-spacing:.01em;overflow-x:clip;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
img{display:block}
.col{width:min(608px,100% - 40px);margin-inline:auto}
.label{font:400 12px/16px "DM Mono",monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);margin:0 0 16px}
.mono{font-family:"DM Mono",monospace}
.logo{width:20px;height:20px;border-radius:5px;display:inline-block;vertical-align:-4px;margin:0 6px 0 4px}

/* header */
header{padding:96px 0 0}
.avatar{width:56px;height:56px;border-radius:12px;object-fit:cover;margin-bottom:16px;box-shadow:0 0 0 1px rgba(0,0,0,.06)}
.name{color:var(--ink);margin:0;line-height:19.2px}
.role{color:var(--ink2);margin:0;line-height:19.2px}
.intro{margin:40px 0 0;color:var(--ink2)}
.intro a{color:var(--ink);white-space:nowrap}
.intro a:hover{text-decoration:underline;text-underline-offset:3px}

/* work */
section{margin-top:96px}
.band{margin-top:28px;padding:28px 0;background-image:radial-gradient(var(--dot) 1px,transparent 1.3px);background-size:12px 12px;overflow:hidden}
.stage{position:relative;width:770px;height:530px;margin-inline:auto;transform-origin:top left}
.egg{position:absolute;left:337px;top:217px;width:96px;height:96px;z-index:0;fill:var(--dot);pointer-events:none;overflow:visible}
.card{position:absolute;width:300px;padding:5px;background:#fff;border-radius:12px;box-shadow:0 0 0 1px rgba(0,0,0,.12),0 6px 12px rgba(0,0,0,.04);cursor:grab;touch-action:none;user-select:none;-webkit-user-drag:none;transition:box-shadow .2s;outline:none;will-change:transform}
.card img{width:290px;height:238px;border-radius:7px;object-fit:cover;pointer-events:none}
.card:hover,.card:focus-visible{box-shadow:0 0 0 1px rgba(0,0,0,.14),0 14px 28px rgba(0,0,0,.1)}
.card:focus-visible{box-shadow:0 0 0 2px var(--ink),0 14px 28px rgba(0,0,0,.1)}
.card.drag{cursor:grabbing;box-shadow:0 0 0 1px rgba(0,0,0,.14),0 22px 40px rgba(0,0,0,.14)}
.chip{position:absolute;left:10px;bottom:10px;max-width:calc(100% - 20px);text-wrap:wrap;display:block;background:rgba(255,255,255,.96);color:var(--ink);font:400 12px/16px "DM Mono",monospace;letter-spacing:0;padding:6px 8px;border-radius:4px;box-shadow:0 0 0 1px rgba(0,0,0,.08),0 4px 10px rgba(0,0,0,.08);opacity:0;transform:translateY(4px);transition:.18s;pointer-events:none}
.card:hover .chip,.card:focus-visible .chip{opacity:1;transform:none}
.card:hover,.card:focus-visible{z-index:999!important}
@media (max-width:699px),(pointer:coarse){.card{touch-action:auto;cursor:pointer}}
@media (hover:none){.chip{opacity:1;transform:none}}

/* experience */
.exp{list-style:none;margin:32px 0 0;padding:0}
.exp li{display:grid;grid-template-columns:106px minmax(0,1fr);gap:0 30px;margin-bottom:30px;align-items:first baseline}
.exp .d{font:400 14px/24px "DM Mono",monospace;letter-spacing:.01em;color:var(--ink);white-space:nowrap}
.exp p{margin:0}
.exp .t{color:var(--ink2)}
.exp .c{color:var(--ink)}
.exp a.co-link{display:inline;border-radius:6px}
.exp a.co-link:hover .c{text-decoration:underline;text-underline-offset:3px}
.exp a.co-link:hover .logo{transform:scale(1.08)}
.exp .logo{transition:transform .15s}

/* contact */
.contact{list-style:none;margin:96px auto 0;padding:0 0 96px}
.contact li a{display:flex;justify-content:space-between;align-items:center;padding:3.5px 0;color:var(--ink2)}
.contact .l{display:flex;align-items:center;gap:10px}
.contact svg{width:18px;height:18px;stroke:var(--icon);fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex:none}
.contact .r{display:flex;align-items:center;gap:8px}
.contact a:hover .r span{color:var(--ink)}
.contact a:hover svg.arrow{stroke:var(--ink2)}

/* case study */
.cs{padding:72px 0 0}
.back{display:inline-flex;align-items:center;gap:8px;font:400 12px/16px "DM Mono",monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);padding:12px 0;margin:-12px 0 36px}
.back:hover{color:var(--ink)}
.co{display:flex;align-items:center;color:var(--ink);margin:0 0 10px}
.co .logo{margin:0 8px 0 0}
.cs h1{font:500 28px/1.2 Inter,sans-serif;letter-spacing:-.01em;color:var(--strong);margin:0;text-wrap:balance}
.lede{margin:16px 0 0;font-size:17px;line-height:27px}
.hero{width:min(780px,100% - 24px);margin:44px auto 0;padding:6px;background:#fff;border-radius:14px;box-shadow:0 0 0 1px rgba(0,0,0,.12),0 10px 24px rgba(0,0,0,.05)}
.hero img{width:100%;height:auto;aspect-ratio:1400/1157;border-radius:9px;object-fit:cover}
.shot{position:relative;left:50%;transform:translateX(-50%);width:min(780px,100vw - 24px);margin:44px 0 0;padding:6px;background:#fff;border-radius:14px;box-shadow:0 0 0 1px rgba(0,0,0,.12),0 10px 24px rgba(0,0,0,.05)}
.shot img{width:100%;height:auto;border-radius:9px}
.shot figcaption{font:400 12px/18px "DM Mono",monospace;color:var(--mute);padding:10px 6px 4px}
.clip{margin:16px 30px 4px 0;padding:6px;background:#fff;border-radius:12px;box-shadow:0 0 0 1px rgba(0,0,0,.12),0 6px 16px rgba(0,0,0,.05)}
.clip video{display:block;width:100%;height:auto;aspect-ratio:1152/720;border-radius:8px;background:#fff}
.clip img{display:block;width:100%;height:auto;border-radius:8px}
.clip figcaption{font:400 12px/18px "DM Mono",monospace;color:var(--mute);padding:10px 6px 4px}
.meta{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;margin:44px 0 0;padding:20px 0;border-block:1px solid var(--line)}
.meta dt{font:400 12px/16px "DM Mono",monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);margin-bottom:6px}
.meta dd{margin:0;color:var(--ink);font-size:15px;line-height:22px}
.cs section{margin-top:52px}
.cs section p{margin:0 0 14px}
.steps{list-style:none;margin:0;padding:0;counter-reset:s}
.steps li{position:relative;padding:0 0 0 30px;margin:0 0 16px}
.steps li::before{counter-increment:s;content:counter(s);position:absolute;left:0;top:0;font:400 13px/24px "DM Mono",monospace;color:var(--mute)}
.steps b{font-weight:500;color:var(--ink)}
.note{font:400 12px/18px "DM Mono",monospace;color:var(--mute);margin-top:6px}
.pager{display:grid;grid-template-columns:1fr 1fr;gap:clamp(24px,10vw,72px);margin:72px 0 0;padding-top:24px;border-top:1px solid var(--line)}
.pager a{display:block;padding:8px 0}
.pager span{display:block;font:400 12px/16px "DM Mono",monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);margin-bottom:4px}
.pager b{font-weight:400;color:var(--ink)}
.pager strong{font-weight:600}
.pager a:hover b{text-decoration:underline;text-underline-offset:3px}
.pager .nx{text-align:right}
.view{animation:in .35s ease both}
@keyframes in{from{opacity:0;transform:translateY(6px)}}
.hero img,.shot img,.clip img,.clip video{cursor:zoom-in}
.lb{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;padding:clamp(12px,4vw,48px);background:rgba(28,26,24,.88);opacity:0;visibility:hidden;transition:opacity .2s,visibility .2s;cursor:zoom-out}
.lb.open{opacity:1;visibility:visible}
.lb img,.lb video{max-width:100%;max-height:100%;width:auto;height:auto;border-radius:10px;box-shadow:0 20px 60px rgba(0,0,0,.4);background:#fff}
.lb video{cursor:default}
.lb [hidden]{display:none!important}
.lb.can-zoom img{cursor:zoom-in}
.lb.zoomed{overflow:auto;display:block}
.lb.zoomed img{max-width:none;max-height:none;cursor:zoom-out;margin:auto}
.lb button{position:absolute;top:14px;right:14px;width:44px;height:44px;padding:0;border:0;border-radius:22px;background:rgba(255,255,255,.14);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center}
.lb button svg{width:18px;height:18px;display:block;stroke:currentColor;stroke-width:2;stroke-linecap:round;fill:none}
.lb button:hover,.lb button:focus-visible{background:rgba(255,255,255,.26);outline:none}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.view{animation:none}.card,.chip,.lb{transition:none}}
@media (max-width:600px){
  header{padding-top:56px}
  section{margin-top:72px}
  .exp li{grid-template-columns:1fr;gap:2px}
  .meta{grid-template-columns:1fr 1fr}
  .cs h1{font-size:24px}
}
</style>
</head>

    ${CS.map(c=>{const [x,y,r,z]=P()[c.id];return `<a class="card" draggable="false" href="#${c.id}" data-id="${c.id}" style="left:${x}px;top:${y}px;transform:rotate(${r}deg);z-index:${z}" aria-label="${c.co}: ${c.title}"><img src="${c.img}" alt="${c.co}: ${c.title}" draggable="false"><span class="chip">${c.title} →</span></a>`}).join('')}

<section class="col">
  <p class="label">Experience</p>
  <p style="margin:0">Throughout my career, I've worked on tooling in many industries including aviation, connected devices, language learning, and professional tooling. I've lead projects and small teams while thriving best in a player-coach role.</p>
  <ul class="exp">
    ${EXP.map(([d,t,c,l,desc])=>{const co=`<img class="logo" src="${l}" alt=""><span class="c">${c}</span>`, u=LINKS[c];return `<li><span class="d">${d}</span><div><p class="t">${t} at ${u?`<a class="co-link" href="${u}" target="_blank" rel="noopener">${co}</a>`:co}</p>${desc?`<p>${desc}</p>`:''}</div></li>`}).join('')}
  </ul>
</section>
${contact}
</div>`;

const study = c => {
  const i = CS.indexOf(c), prev = CS[(i+CS.length-1)%CS.length], next = CS[(i+1)%CS.length];
  return `<div class="view cs">
  <div class="col">
    <a class="back" href="#work">← Back to Home</a>
    <p class="co"><img class="logo" src="${c.logo}" alt="">${c.co}</p>
    <h1>${c.title}</h1>
    <p class="lede">${c.lede}</p>
  </div>
  <div class="hero"><img src="${c.img}" alt="${c.co}: ${c.title}"></div>
  <div class="col">
    <dl class="meta">${c.meta.map(([k,v])=>`<div><dt>${k}</dt><dd>${v}</dd></div>`).join('')}</dl>
    <section><p class="label">Problem</p>${c.problem.map(p=>`<p>${p}</p>`).join('')}</section>
    <section><p class="label">${c.stepsLabel||'Approach'}</p><ol class="steps">${c.steps.map(([b,t,m])=>`<li><b>${b}</b> ${t}${m?`<figure class="clip">${m.video?`<video src="${m.video}" poster="${m.poster}" aria-label="${m.label}"${m.ratio?` style="aspect-ratio:${m.ratio}"`:''} autoplay muted loop playsinline preload="metadata"></video>`:`<img src="${m.img}" alt="${m.label}" loading="lazy">`}${m.caption?`<figcaption>${m.caption}</figcaption>`:''}</figure>`:''}</li>`).join('')}</ol></section>
    ${c.afterSteps?`<figure class="shot"><img src="${c.afterSteps[0]}" alt="${c.afterSteps[1]}" loading="lazy"><figcaption>${c.afterSteps[2]}</figcaption></figure>`:''}
    <section><p class="label">Outcome</p>${c.outcome.map(p=>`<p>${p}</p>`).join('')}</section>
    ${(c.gallery||[]).map(([src,alt,cap])=>`<figure class="shot"><img src="${src}" alt="${alt}" loading="lazy">${cap?`<figcaption>${cap}</figcaption>`:''}</figure>`).join('')}
    <nav class="pager">
      <a href="#${prev.id}"><span>← Previous</span><b><strong>${prev.co}:</strong> ${prev.title}</b></a>
      <a class="nx" href="#${next.id}"><span>Next →</span><b><strong>${next.co}:</strong> ${next.title}</b></a>
    </nav>
  </div>
  ${contact}
  </div>`;
};

const app = document.getElementById('app');
let lastHome = true;

function fit(){
  const s = document.getElementById('stage'); if(!s) return;
  const m = mode();
  if(homeMode && homeMode !== m && !CS.some(c => '#'+c.id === location.hash)){ homeMode = null; app.innerHTML = home(); bindDrag(); return fit(); }
  homeMode = m;
  const L = LAYOUT[m], k = Math.min(1, (window.innerWidth - 24) / L.W);
  s.style.width = L.W + 'px'; s.style.height = L.H + 'px';
  s.style.transform = k<1 ? `scale(${k})` : '';
  s.style.marginLeft = k<1 ? Math.max(12, (window.innerWidth - L.W*k)/2) + 'px' : 'auto';
  s.parentElement.style.height = (L.H*k + 56) + 'px';
  const egg = s.querySelector('.egg'); if(egg){ egg.style.left = L.egg[0]+'px'; egg.style.top = L.egg[1]+'px'; }
}

function bindDrag(){
  let top = 10;
  const calm = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const stage = document.getElementById('stage'), band = stage.parentElement;
  const scale = () => { const t = stage.style.transform.match(/scale\(([\d.]+)\)/); return t ? +t[1] : 1; };
  /* the dotted band is the canvas: cards can sit anywhere inside it */
  const bounds = () => {
    const k = scale(), s = stage.getBoundingClientRect(), d = band.getBoundingClientRect(), m = 10;
    return { x0:(d.left-s.left)/k+m, x1:(d.right-s.left)/k-300-m, y0:(d.top-s.top)/k+m, y1:(d.bottom-s.top)/k-248-m };
  };
  const soft = (v, lo, hi) => v<lo ? lo-(lo-v)*0.35 : v>hi ? hi+(v-hi)*0.35 : v;
  document.querySelectorAll('.card').forEach(card=>{
    const [hx, hy, base] = P()[card.dataset.id];
    let x=hx, y=hy, tx=hx, ty=hy, vx=0, vy=0, tilt=0, lift=0;
    let sx, sy, ox, oy, lx, ly, lt, down=false, moved=false, raf=0;
    const paint = () => { card.style.left = x+'px'; card.style.top = y+'px'; card.style.transform = `rotate(${base+tilt}deg) scale(${1+lift})`; };
    const loop = () => {
      const B = bounds();
      if(down){
        /* follow the pointer with a slight, smooth lag */
        const px=x, py=y; x += (tx-x)*0.4; y += (ty-y)*0.4; vx = x-px; vy = y-py;
      } else {
        /* glide on release, then ease back inside the canvas edges */
        x += vx; y += vy; vx *= 0.88; vy *= 0.88;
        const ex = x<B.x0 ? B.x0-x : x>B.x1 ? B.x1-x : 0, ey = y<B.y0 ? B.y0-y : y>B.y1 ? B.y1-y : 0;
        if(ex){ vx = vx*0.7 + ex*0.12; } if(ey){ vy = vy*0.7 + ey*0.12; }
      }
      tilt += ((down ? Math.max(-4, Math.min(4, vx*0.35)) : 0) - tilt) * 0.15;
      lift += ((down&&moved ? 0.03 : 0) - lift) * 0.2;
      paint();
      const B2 = bounds(), inside = x>=B2.x0-0.5 && x<=B2.x1+0.5 && y>=B2.y0-0.5 && y<=B2.y1+0.5;
      if(!down && inside && Math.abs(vx)+Math.abs(vy)+Math.abs(tilt)+lift < 0.04){ vx=vy=tilt=lift=0; paint(); raf=0; }
      else raf = requestAnimationFrame(loop);
    };
    const kick = () => { if(!raf) raf = requestAnimationFrame(loop); };
    card.addEventListener('pointerdown', e=>{
      if(e.button!==0 || e.pointerType==='touch' || mode()==='m') return;
      e.preventDefault();
      down=true; moved=false; sx=e.clientX; sy=e.clientY; ox=x; oy=y; tx=x; ty=y;
      card.style.zIndex = ++top; card.setPointerCapture(e.pointerId);
    });
    card.addEventListener('pointermove', e=>{
      if(!down) return;
      const k = scale(), dx=(e.clientX-sx)/k, dy=(e.clientY-sy)/k;
      if(!moved && Math.hypot(dx,dy)<5) return;
      moved=true; card.classList.add('drag');
      const B = bounds(); tx = soft(ox+dx, B.x0, B.x1); ty = soft(oy+dy, B.y0, B.y1);
      if(calm){ x=Math.max(B.x0,Math.min(B.x1,tx)); y=Math.max(B.y0,Math.min(B.y1,ty)); paint(); } else kick();
    });
    const end = ()=>{
      if(!down) return; down=false; card.classList.remove('drag');
      if(calm) return;
      vx *= 0.8; vy *= 0.8; kick();
    };
    card.addEventListener('pointerup', end);
    card.addEventListener('pointercancel', end);
    card.addEventListener('lostpointercapture', end);
    card.addEventListener('click', e=>{ if(moved){ e.preventDefault(); moved=false; } });
  });
}

function route(){
  const id = location.hash.slice(1);
  const c = CS.find(x=>x.id===id);
  if(c){
    app.innerHTML = study(c);
    if(matchMedia('(prefers-reduced-motion: reduce)').matches) app.querySelectorAll('video').forEach(v=>{v.autoplay=false;v.pause();v.controls=true;});
    document.title = `${c.co}: ${c.title} · Amy Brumet`;
    window.scrollTo({top:0, behavior:'instant'});
    lastHome = false;
  } else {
    const wasHome = lastHome && app.innerHTML;
    if(!wasHome){ app.innerHTML = home(); bindDrag(); fit(); }
    document.title = 'Amy Brumet';
    if(id==='work'){ const w=document.getElementById('work'); requestAnimationFrame(()=>w.scrollIntoView({behavior:'instant'})); }
    else if(!wasHome) window.scrollTo({top:0, behavior:'instant'});
    lastHome = true;
  }
}

/* lightbox for case study images */
const lb = document.getElementById('lb'), lbImg = lb.querySelector('img');
let lbFrom = null;
const lbVid = lb.querySelector('video');
const lbClose = () => { lbVid.pause(); lbVid.removeAttribute('src'); lbVid.load(); lb.classList.remove('open','zoomed'); lb.setAttribute('aria-hidden','true'); document.body.style.overflow=''; if(lbFrom){ lbFrom.focus?.(); lbFrom=null; } };
app.addEventListener('click', e => {
  const im = e.target.closest('.hero img, .shot img, .clip img, .clip video'); if(!im) return;
  lbFrom = im;
  if(im.tagName==='VIDEO'){ lbImg.hidden=true; lbVid.hidden=false; lb.classList.remove('can-zoom'); lbVid.src = im.currentSrc || im.src; lbVid.setAttribute('aria-label', im.getAttribute('aria-label')||''); lbVid.play().catch(()=>{}); }
  else { lbVid.hidden=true; lbImg.hidden=false; lbImg.src = im.currentSrc || im.src; lbImg.alt = im.alt; }
  lb.classList.add('open'); lb.setAttribute('aria-hidden','false'); document.body.style.overflow='hidden'; lb.querySelector('button').focus();
});
lb.addEventListener('click', e => {
  if(e.target===lbVid) return;
  if(e.target===lbImg && lb.classList.contains('can-zoom')){ lb.classList.toggle('zoomed'); return; }
  lb.classList.remove('zoomed'); lbClose();
});
lbImg.addEventListener('load', () => { lb.classList.toggle('can-zoom', lbImg.naturalWidth > lbImg.clientWidth * 1.15); });
document.addEventListener('keydown', e => { if(e.key==='Escape' && lb.classList.contains('open')) lbClose(); });
window.addEventListener('hashchange', () => { if(lb.classList.contains('open')) lbClose(); });

window.addEventListener('hashchange', route);
window.addEventListener('resize', fit);
route();
}
</script>
